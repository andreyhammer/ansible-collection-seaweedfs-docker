---
worker_jobs:
  ec:
    type: erasure_coding
    instances: 2
  balance:
    type: ec_balance
    instances: 1
  lifecycle:
    type: s3_lifecycle
    instances: 1
  vacuum:
    type: vacuum
    instances: 1

# 0 disables metrics. Override per alias (host_vars) to give workers distinct ports.
worker_metrics_port: 0
