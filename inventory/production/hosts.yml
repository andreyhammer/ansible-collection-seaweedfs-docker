---
# Example inventory: one node (10.0.0.11) with 5 volume groups of 2 disks and a full set of workers.
# Every container instance is a separate alias; ansible_host is the node IP.
all:
  children:
    seaweed:
      children:
        master:
          hosts:
            master01:
              ansible_host: 10.0.0.11
              node_num: 1
        filer:
          hosts:
            filer01:
              ansible_host: 10.0.0.11
              node_num: 1
        admin:
          hosts:
            admin01:
              ansible_host: 10.0.0.11
              node_num: 1
        volume:
          hosts:
            volume01-dg01:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack01
            volume01-dg02:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack01
            volume01-dg03:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack01
            volume01-dg04:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 4
              volume_data_dirs: [/mnt/disk07, /mnt/disk08]
              volume_rack: rack01
            volume01-dg05:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 5
              volume_data_dirs: [/mnt/disk09, /mnt/disk10]
              volume_rack: rack01
        worker:
          hosts:
            worker01-ec01:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
            worker01-ec02:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: ec
              worker_job_index: 2
              worker_job_type: erasure_coding
            worker01-balance01:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: balance
              worker_job_index: 1
              worker_job_type: ec_balance
            worker01-lifecycle01:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: lifecycle
              worker_job_index: 1
              worker_job_type: s3_lifecycle
            worker01-vacuum01:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: vacuum
              worker_job_index: 1
              worker_job_type: vacuum
    # One group per physical node lets you add the whole node with `add_node -e target_node=node01`.
    node01:
      hosts:
        master01:
        filer01:
        admin01:
        volume01-dg01:
        volume01-dg02:
        volume01-dg03:
        volume01-dg04:
        volume01-dg05:
        worker01-ec01:
        worker01-ec02:
        worker01-balance01:
        worker01-lifecycle01:
        worker01-vacuum01:
