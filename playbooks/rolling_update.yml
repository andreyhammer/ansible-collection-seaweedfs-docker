---
# Usage: ansible-playbook andreyhammer.seaweedfs_docker.rolling_update -e seaweed_version=X [-e target_group=master]
# Upgrade order: master (leader last), filer, admin, volume, worker. Without target_group every group is upgraded in
# that order and the run stops at the first failure; with target_group only that group is upgraded.
# An instance whose container already runs the requested image is left alone
# (-e rolling_update_force=true to go through it).
- name: Upgrade the masters
  ansible.builtin.import_playbook: rolling_update_group.yml
  vars:
    rolling_group: master
  when: target_group is not defined or target_group == 'master'

- name: Upgrade the filers
  ansible.builtin.import_playbook: rolling_update_group.yml
  vars:
    rolling_group: filer
  when: target_group is not defined or target_group == 'filer'

- name: Upgrade the admin servers
  ansible.builtin.import_playbook: rolling_update_group.yml
  vars:
    rolling_group: admin
  when: target_group is not defined or target_group == 'admin'

- name: Upgrade the volume servers
  ansible.builtin.import_playbook: rolling_update_group.yml
  vars:
    rolling_group: volume
  when: target_group is not defined or target_group == 'volume'

- name: Upgrade the workers
  ansible.builtin.import_playbook: rolling_update_group.yml
  vars:
    rolling_group: worker
  when: target_group is not defined or target_group == 'worker'

- name: Remind to keep the inventory in step
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Ask the operator to update seaweed_version in the inventory
      ansible.builtin.debug:
        msg:
          - "{{ target_group | default('Every group') }} now runs SeaweedFS {{ seaweed_version }}."
          - >-
            ACTION NEEDED: this version came from the command line. Set seaweed_version: "{{ seaweed_version }}" in your
            inventory (or group_vars) once every group is upgraded.
      run_once: true
