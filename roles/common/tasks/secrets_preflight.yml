---
# Checks that run before a rolling update changes anything: a secret that is missing is found now, not when the run
# reaches the admin server after the masters and filers are already upgraded. Nothing is printed: the values are
# secrets, the messages name the environment variable instead. The admin password is checked in the admin role.
# Every config file of the host's groups whose content has a [jwt.filer_signing] section must carry a key. A lookup
# of an unset environment variable renders to an empty string, which the admin server and the workers would accept
# at deploy time and then refuse to talk to each other.
- name: Collect the config files of this host
  ansible.builtin.set_fact:
    secrets_preflight_files: >-
      {{ secrets_preflight_files | default([])
         + (lookup('ansible.builtin.vars', item ~ '_config_files', default=[]) | list) }}
  loop: "{{ ['master', 'filer', 'admin', 'volume', 'worker'] | select('in', group_names) | list }}"
  no_log: true

- name: Require the filer signing key wherever it is configured
  ansible.builtin.assert:
    that: >-
      (item.content | regex_findall('key\s*=\s*"([^"]*)"') | default([''], true) | first | trim) | length > 0
    fail_msg: >-
      {{ inventory_hostname }}: {{ item.dest | default('a config file') }} has a [jwt.filer_signing] section with an
      empty key. Export the variable that supplies it (SEAWEED_JWT_FILER_SIGNING_KEY in the documented example) and
      start again; nothing has been changed.
    quiet: true
  loop: "{{ secrets_preflight_files | default([]) | selectattr('content', 'defined')
            | selectattr('content', 'search', 'jwt[.]filer_signing') | list }}"
  loop_control:
    label: "{{ item.dest | default('config file') }}"
  no_log: true
