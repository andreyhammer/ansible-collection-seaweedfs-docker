---
seaweed_version: "latest"
seaweed_image_repo: chrislusf/seaweedfs
# seaweed_large_disk has no default on purpose: it must be set explicitly (see roles/common/tasks/image_variant.yml).
seaweed_image: "{{ seaweed_image_repo }}:{{ seaweed_version }}{{ '_large_disk' if seaweed_large_disk | bool else '' }}"
docker_compose_dir: /opt/seaweed
container_prefix: ""
container_role_filer: filer
health_check_timeout: 60

masters_list: []
masters: "{{ masters_list | join(',') }}"

filer_port: 8888
filer_container_name: "{{ container_prefix }}{{ container_role_filer }}{{ '%02d' | format(node_num | int) }}"
filer_project_dir: "{{ docker_compose_dir }}/{{ filer_container_name }}"

# Optional S3 gateway (port 8333).
filer_s3_enabled: false
filer_s3_port: 8333
# Seconds; empty = SeaweedFS default.
filer_s3_idle_timeout: ""

# PostgreSQL metadata store. The password is read from the operator's environment.
filer_postgres_enabled: false
filer_postgres_host: ""
filer_postgres_port: 5432
filer_postgres_db: seaweedfs
filer_postgres_user: seaweedfs
filer_postgres_password: "{{ lookup('ansible.builtin.env', 'SEAWEED_FILER_POSTGRES_PASSWORD') }}"

# Extra options (all roles). *_extra_args are appended to the command; *_environment is merged over
# seaweed_environment; *_extra_volumes are "host:container[:mode]" strings; *_config_files are deployed
# to the node and mounted: [{src|content, dest, container_path, mode (0644), read_only (true), secret (false)}].
seaweed_environment: {}
seaweed_localtime: false
seaweed_logging: {}
filer_extra_args: []
filer_environment: {}
filer_extra_volumes: []
filer_config_files: []
filer_logging: "{{ seaweed_logging }}"

# Environment injected by the PostgreSQL settings above (the built-in leveldb2 store is on by default and
# the filer refuses to run with two stores).
filer_postgres_env:
  WEED_LEVELDB2_ENABLED: "false"
  WEED_POSTGRES2_ENABLED: "true"
  WEED_POSTGRES2_HOSTNAME: "{{ filer_postgres_host }}"
  WEED_POSTGRES2_PORT: "{{ filer_postgres_port }}"
  WEED_POSTGRES2_DATABASE: "{{ filer_postgres_db }}"
  WEED_POSTGRES2_USERNAME: "{{ filer_postgres_user }}"
  WEED_POSTGRES2_PASSWORD: "{{ filer_postgres_password }}"
