---
seaweed_version: "latest"
seaweed_image_repo: chrislusf/seaweedfs
# seaweed_large_disk has no default on purpose: it must be set explicitly (see roles/common/tasks/image_variant.yml).
seaweed_image: "{{ seaweed_image_repo }}:{{ seaweed_version }}{{ '_large_disk' if seaweed_large_disk | bool else '' }}"
docker_compose_dir: /opt/seaweed
container_prefix: ""
container_role_worker: worker
container_role_admin: admin
health_check_timeout: 60

# Admin address "host:port". Defaults to the first host of the `admin` group.
worker_admin_address: "{{ hostvars[groups['admin'] | first].ansible_host }}:23646"

# Job suffix -> job type and instances per node. Used to validate inventory aliases.
worker_jobs:
  ec:
    type: erasure_coding
    instances: 2
  balance:
    type: ec_balance
    instances: 1
  lifecycle:
    type: s3_lifecycle
    instances: 1
  vacuum:
    type: vacuum
    instances: 1

worker_max_execute: 1
# 0 disables metrics.
worker_metrics_port: 0

# Per-alias variables (set in the inventory): worker_node_num, worker_job_suffix, worker_job_index, worker_job_type.
worker_container_name: >-
  {{ container_prefix }}{{ container_role_worker }}{{ '%02d' | format(worker_node_num | int) }}
  {{- '-' ~ worker_job_suffix ~ ('%02d' | format(worker_job_index | int)) }}
worker_project_dir: "{{ docker_compose_dir }}/{{ worker_container_name }}"
