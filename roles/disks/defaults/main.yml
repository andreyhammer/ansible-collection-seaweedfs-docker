---
# Disks to prepare on this node. One entry per disk:
#   device: stable name such as /dev/disk/by-id/ata-EXAMPLE_MODEL_SERIAL0001 (never /dev/sdX, see below)
#   label:  filesystem label, 1-12 characters (XFS limit), also used in /etc/fstab (LABEL=<label>)
#   mount:  absolute mount point, e.g. /mnt/disk1
disks_filesystems: []

disks_mount_options: defaults,noatime
# Install the XFS tools (Debian: xfsprogs) when they are missing.
disks_install_packages: true
# Formatting destroys data, so it is off by default: the role fails and lists the empty disks it would format.
# Review the list (and a run with --check), then pass -e disks_format=true.
disks_format: false
# /dev/sdX names change between boots and controller order; only set this for a throwaway test.
disks_allow_unstable_names: false
