---
# Waits until a started volume server is usable: its port answers, the master lists it, and (with volume_ec_check) its
# EC shards are registered again. Needs volume_ec_shards_before when volume_ec_check is set. Included by main.yml (after
# a start) and restart.yml (after a restart).
- name: Wait for the volume port
  ansible.builtin.wait_for:
    host: "{{ (seaweed_ip | default(ansible_host, true)) }}"
    port: "{{ volume_port }}"
    timeout: "{{ health_check_timeout }}"
  when: not ansible_check_mode

- name: Verify the volume server is registered in the master
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: cluster_status
  vars:
    seaweed_expected_node: "{{ (seaweed_ip | default(ansible_host, true)) }}:{{ volume_port }}"
    seaweed_status_path: /dir/status
  when: not ansible_check_mode

- name: Wait until the EC shards are registered again
  when: not ansible_check_mode and volume_ec_check | bool and volume_ec_shards_before | int > 0
  block:
    - name: Start waiting for the EC shard registration
      ansible.builtin.set_fact:
        volume_ec_settled: false
        volume_ec_shards_prev: -1
        volume_ec_round: 0
        volume_ec_max_rounds: "{{ ((volume_ec_register_timeout | int) / (volume_ec_settle_seconds | int)) | round(0, 'ceil') | int + 1 }}"

    # The server registers its shards with the heartbeat after the start, which can take minutes with tens of thousands
    # of them. The count is compared with the previous round, not with the number before the start: shards are also
    # moved and deleted (TTL) by the cluster while the server is down. Rounds repeat until the count settles.
    - name: Wait until the master stops listing more EC shards
      ansible.builtin.include_tasks: ec_settle.yml

    - name: Fail when the EC shards are still being registered
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} had {{ volume_ec_shards_before }} EC shards registered before the start; after
          {{ volume_ec_register_timeout }} s the master lists {{ volume_ec_shards_now }} and the number is still
          changing or is zero. Not continuing: check the volume server log before touching another server.
      when: not volume_ec_settled | bool

    - name: Report the EC shards
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: the master lists {{ volume_ec_shards_now }} EC shards
          ({{ volume_ec_shards_before }} before the start).
