---
- name: Validate volume variables
  ansible.builtin.assert:
    that:
      - volume_node_num is defined
      - volume_dg is defined
      - volume_data_dirs is defined
      - volume_data_dirs | length > 0
      - masters_list | length > 0
    fail_msg: "volume_node_num, volume_dg, volume_data_dirs and masters_list must be set for {{ inventory_hostname }}."
    quiet: true

- name: Check the image variant
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: image_guard
  vars:
    seaweed_guard_container: "{{ volume_container_name }}"

- name: Check that a master is reachable
  ansible.builtin.wait_for:
    host: "{{ (masters_list | first).split(':') | first }}"
    port: "{{ (masters_list | first).split(':') | last | int }}"
    timeout: "{{ health_check_timeout }}"
  when: not ansible_check_mode

- name: Create the volume project directory
  ansible.builtin.file:
    path: "{{ volume_project_dir }}"
    state: directory
    mode: "0755"

- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ volume_container_uid }}"
    group: "{{ volume_container_gid }}"
    mode: "0755"
  loop: "{{ volume_data_dirs }}"

- name: Create the index directory
  ansible.builtin.file:
    path: "{{ volume_index_dir }}"
    state: directory
    owner: "{{ volume_container_uid }}"
    group: "{{ volume_container_gid }}"
    mode: "0755"

- name: Deploy config files
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: config_files
  vars:
    seaweed_config_files: "{{ volume_config_files }}"

# The official entrypoint chowns only /data, so files that already sit on a mounted disk (for example data written
# by containers that ran as root) stay unreadable for uid 1000. Catch that before the container starts.
- name: Look for files not owned by the container user
  ansible.builtin.command:
    argv:
      - find
      - "{{ item }}"
      - -mindepth
      - "1"
      - "!"
      - "("
      - -uid
      - "{{ volume_container_uid }}"
      - -gid
      - "{{ volume_container_gid }}"
      - ")"
      - -print
      - -quit
  loop: "{{ volume_data_dirs + [volume_index_dir] }}"
  register: volume_foreign_files
  changed_when: false
  failed_when: false
  check_mode: false
  when: volume_check_ownership | bool and volume_entrypoint | length == 0

- name: Fix ownership of existing files
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    recurse: true
    owner: "{{ volume_container_uid }}"
    group: "{{ volume_container_gid }}"
  loop: "{{ volume_foreign_files.results | default([]) | selectattr('stdout', 'truthy') }}"
  loop_control:
    label: "{{ item.item }}"
  when: volume_fix_ownership | bool

- name: Fail on files not owned by the container user
  ansible.builtin.fail:
    msg: >-
      {{ item.item }} holds files not owned by {{ volume_container_uid }}:{{ volume_container_gid }}
      (first one: {{ item.stdout }}). The container would not be able to use them. Fix it with
      `chown -R {{ volume_container_uid }}:{{ volume_container_gid }} {{ item.item }}` or run with
      -e volume_fix_ownership=true.
  loop: "{{ volume_foreign_files.results | default([]) | selectattr('stdout', 'truthy') }}"
  loop_control:
    label: "{{ item.item }}"
  when: volume_check_ownership | bool and not volume_fix_ownership | bool

- name: Generate compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ volume_project_dir }}/compose.yaml"
    mode: "0600"

- name: Check whether the volume project exists
  ansible.builtin.stat:
    path: "{{ volume_project_dir }}/compose.yaml"
  register: volume_compose_file

# The shards this server holds are registered with the master by its heartbeat after every start; a restart must
# not be considered finished (and the next server must not be touched) before they are back.
- name: Count the EC shards registered before the start
  ansible.builtin.include_tasks: ec_shards.yml
  when: not ansible_check_mode and volume_ec_check | bool

- name: Remember the EC shard count before the start
  ansible.builtin.set_fact:
    volume_ec_shards_before: "{{ volume_ec_shards_now }}"
  when: not ansible_check_mode and volume_ec_check | bool

- name: Move the volume container into the shared Compose project
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: project_migrate
  vars:
    seaweed_guard_container: "{{ volume_container_name }}"

- name: Update the node compose file
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: compose_index

# In check mode the project directory is not created, and docker compose cannot inspect a missing project.
- name: Start the volume container
  community.docker.docker_compose_v2:
    project_src: "{{ volume_project_dir }}"
    project_name: "{{ compose_project_name }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if seaweed_config_changed | default(false) | bool else 'auto' }}"
  when: not ansible_check_mode or volume_compose_file.stat.exists

- name: Wait for the volume port
  ansible.builtin.wait_for:
    host: "{{ (seaweed_ip | default(ansible_host, true)) }}"
    port: "{{ volume_port }}"
    timeout: "{{ health_check_timeout }}"
  when: not ansible_check_mode

- name: Verify the volume server is registered in the master
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: cluster_status
  vars:
    seaweed_expected_node: "{{ (seaweed_ip | default(ansible_host, true)) }}:{{ volume_port }}"
    seaweed_status_path: /dir/status
  when: not ansible_check_mode

- name: Wait until the EC shards are registered again
  ansible.builtin.include_tasks: ec_shards.yml
  vars:
    volume_ec_wait_for: "{{ volume_ec_shards_before }}"
  when: not ansible_check_mode and volume_ec_check | bool

- name: Fail when EC shards did not come back
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} had {{ volume_ec_shards_before }} EC shards registered before the start but the master
      lists {{ volume_ec_shards_now }} after {{ volume_ec_register_timeout }} s. Not continuing: check the volume
      server log and `ec.volume.list`-style output in weed shell before touching another server.
  when: not ansible_check_mode and volume_ec_check | bool and volume_ec_shards_now | int < volume_ec_shards_before | int
