---
seaweed_version: "latest"
seaweed_image_repo: chrislusf/seaweedfs
# seaweed_large_disk has no default on purpose: it must be set explicitly (see roles/common/tasks/image_variant.yml).
seaweed_image: "{{ seaweed_image_repo }}:{{ seaweed_version }}{{ '_large_disk' if seaweed_large_disk | bool else '' }}"
docker_compose_dir: /opt/seaweed
container_prefix: ""
container_role_volume: volume
container_role_master: master
health_check_timeout: 60

masters_list: []
masters: "{{ masters_list | join(',') }}"

# Per-alias variables (set in the inventory): volume_node_num, volume_dg, volume_data_dirs,
# and optionally volume_rack and volume_disk_type.
volume_disk_type_default: hdd
volume_max_volumes: 0

# The image entrypoint only fixes ownership of /data itself, not of mounted /data/diskN or /cache,
# so the host directories must belong to the container user (the image's `seaweed` user).
volume_container_uid: 1000
volume_container_gid: 1000
volume_rack: ""
volume_disk_type: "{{ volume_disk_type_default }}"
volume_index_dir_pattern: "{{ docker_compose_dir }}/index-{{ volume_container_name }}"

volume_container_name: >-
  {{ container_prefix }}{{ container_role_volume }}{{ '%02d' | format(volume_node_num | int) }}
  {{- '-dg' ~ ('%02d' | format(volume_dg | int)) }}
volume_port: "{{ 8080 + (volume_dg | int) }}"
volume_project_dir: "{{ docker_compose_dir }}/{{ volume_container_name }}"

# Maintenance mode used by rolling_update (shell command piped to `weed shell` inside a master container).
volume_maintenance_enabled: "{{ volume_maintenance | default(false) }}"
volume_maintenance_command: >-
  lock; volumeServer.state -nodes {{ ansible_host }}:{{ volume_port }}
  {{ '-maintenanceOn' if volume_maintenance_enabled | bool else '-maintenanceOff' }}; unlock
