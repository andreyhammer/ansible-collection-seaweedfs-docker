---
seaweed_version: "latest"
seaweed_image_repo: chrislusf/seaweedfs
# seaweed_large_disk has no default on purpose: it must be set explicitly (see roles/common/tasks/image_variant.yml).
seaweed_image: "{{ seaweed_image_repo }}:{{ seaweed_version }}{{ '_large_disk' if seaweed_large_disk | bool else '' }}"
docker_compose_dir: /opt/seaweed
compose_project_name: seaweed
container_prefix: ""
container_role_admin: admin
health_check_timeout: 60

masters_list: []
masters: "{{ masters_list | join(',') }}"

admin_port: 23646
admin_container_name: "{{ container_prefix }}{{ container_role_admin }}{{ '%02d' | format(node_num | int) }}"
admin_project_dir: "{{ docker_compose_dir }}/{{ admin_container_name }}"

# The admin server listens on loopback only unless it is protected. To make it reachable (workers on other
# nodes need that) set SEAWEED_ADMIN_PASSWORD (it then listens on all interfaces), or, for isolated trusted
# networks only, admin_allow_insecure_bind: true (binds the node IP without authentication).
admin_bind_ip: ""
# Empty = SeaweedFS default user.
admin_user: ""
admin_allow_insecure_bind: false
admin_password: "{{ lookup('ansible.builtin.env', 'SEAWEED_ADMIN_PASSWORD') }}"
admin_exposed: "{{ admin_password | length > 0 or admin_bind_ip | length > 0 or admin_allow_insecure_bind | bool }}"

# Extra options (all roles). *_extra_args are appended to the command; *_environment is merged over
# seaweed_environment; *_extra_volumes are "host:container[:mode]" strings; *_config_files are deployed
# to the node and mounted: [{src|content, dest, container_path, mode (0644), read_only (true), secret (false)}].
seaweed_environment: {}
seaweed_localtime: false
seaweed_logging: {}
admin_extra_args: []
admin_environment: {}
admin_extra_volumes: []
admin_config_files: []
admin_logging: "{{ seaweed_logging }}"
