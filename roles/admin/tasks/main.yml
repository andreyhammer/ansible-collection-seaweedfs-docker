---
- name: Validate admin variables
  ansible.builtin.assert:
    that:
      - node_num is defined
      - masters_list | length > 0
    fail_msg: "node_num and masters_list must be set for {{ inventory_hostname }}."
    quiet: true

- name: Check the image variant
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: image_guard
  vars:
    seaweed_guard_container: "{{ admin_container_name }}"

# A password makes the web UI listen on every interface, but the worker gRPC port follows -ip only (127.0.0.1 by
# default), so workers on any node, even the admin's own, cannot connect unless -ip is set.
- name: Require a reachable admin when workers are deployed
  ansible.builtin.assert:
    that: admin_workers_reachable | bool or (groups['worker'] | default([]) | length) == 0
    fail_msg: >-
      The inventory has workers, but the admin server would accept worker connections on loopback only: SeaweedFS binds
      the worker gRPC port to -ip, which defaults to 127.0.0.1 even when SEAWEED_ADMIN_PASSWORD is set (the password
      only opens the web UI). Set admin_bind_ip to the address the workers use (the node IP, or 0.0.0.0), or
      admin_allow_insecure_bind: true on an isolated network.
    quiet: true

- name: Check that a master is reachable
  ansible.builtin.wait_for:
    host: "{{ (masters_list | first).split(':') | first }}"
    port: "{{ (masters_list | first).split(':') | last | int }}"
    timeout: "{{ health_check_timeout }}"
  when: not ansible_check_mode

- name: Create the admin project directory
  ansible.builtin.file:
    path: "{{ admin_project_dir }}"
    state: directory
    mode: "0755"

- name: Deploy config files
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: config_files
  vars:
    seaweed_config_files: "{{ admin_config_files }}"

- name: Generate compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ admin_project_dir }}/compose.yaml"
    mode: "0600"
  no_log: true

- name: Check whether the admin project exists
  ansible.builtin.stat:
    path: "{{ admin_project_dir }}/compose.yaml"
  register: admin_compose_file

- name: Move the admin container into the shared Compose project
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: project_migrate
  vars:
    seaweed_guard_container: "{{ admin_container_name }}"

- name: Update the node compose file
  ansible.builtin.include_role:
    name: andreyhammer.seaweedfs_docker.common
    tasks_from: compose_index

# In check mode the project directory is not created, and docker compose cannot inspect a missing project.
- name: Start the admin container
  community.docker.docker_compose_v2:
    project_src: "{{ admin_project_dir }}"
    project_name: "{{ compose_project_name }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if seaweed_config_changed | default(false) | bool else 'auto' }}"
  when: not ansible_check_mode or admin_compose_file.stat.exists

- name: Wait for the admin port
  ansible.builtin.wait_for:
    host: "{{ (seaweed_ip | default(ansible_host, true)) if admin_exposed | bool else '127.0.0.1' }}"
    port: "{{ admin_port }}"
    timeout: "{{ health_check_timeout }}"
  when: not ansible_check_mode
