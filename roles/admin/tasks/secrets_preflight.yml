---
# Runs before a rolling update changes anything (the same test as in main.yml, which would stop the run only after the
# masters and filers are upgraded). The password itself is never printed.
- name: Require the admin password when it is mandatory
  ansible.builtin.assert:
    that: not (admin_require_password | bool) or admin_password | length > 0
    fail_msg: >-
      {{ inventory_hostname }}: admin_require_password is set, but the admin password is empty. Export
      SEAWEED_ADMIN_PASSWORD (or set admin_password) and start again; nothing has been changed.
    quiet: true
  no_log: true
