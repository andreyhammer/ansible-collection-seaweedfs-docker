---
name: swfs-test

x-node: &node
  build: .
  image: swfs-test-node:local
  privileged: true
  restart: "no"

services:
  node01:
    <<: *node
    container_name: swfs-test-node01
    hostname: node01
    volumes:
      - node01-docker:/var/lib/docker
      - ./.work/id_ed25519.pub:/tmp/authorized_key.pub:ro
    networks:
      swfs-test:
        ipv4_address: 172.29.14.11
  node02:
    <<: *node
    container_name: swfs-test-node02
    hostname: node02
    volumes:
      - node02-docker:/var/lib/docker
      - ./.work/id_ed25519.pub:/tmp/authorized_key.pub:ro
    networks:
      swfs-test:
        ipv4_address: 172.29.14.12
  node03:
    <<: *node
    container_name: swfs-test-node03
    hostname: node03
    volumes:
      - node03-docker:/var/lib/docker
      - ./.work/id_ed25519.pub:/tmp/authorized_key.pub:ro
    networks:
      swfs-test:
        ipv4_address: 172.29.14.13

  node04:
    <<: *node
    container_name: swfs-test-node04
    hostname: node04
    volumes:
      - node04-docker:/var/lib/docker
      - ./.work/id_ed25519.pub:/tmp/authorized_key.pub:ro
    networks:
      swfs-test:
        ipv4_address: 172.29.14.14

networks:
  swfs-test:
    name: swfs-test
    ipam:
      config:
        - subnet: 172.29.14.0/24

volumes:
  node01-docker:
  node02-docker:
  node03-docker:
  node04-docker:
