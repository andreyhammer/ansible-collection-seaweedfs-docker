---
# Loaded only by the add_masters step of run.sh (together with ../inventory/hosts.yml), the way an operator would
# add two masters to the inventory: master04 on node04 and master05 on a brand-new node05. masters_list is
# extended in masters5.yml at the same time.
all:
  children:
    seaweed:
      children:
        master:
          hosts:
            master04: {ansible_host: 172.29.14.14, node_num: 4}
            master05: {ansible_host: 172.29.14.15, node_num: 5}
