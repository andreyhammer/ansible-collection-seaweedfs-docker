[defaults]
inventory = inventory/hosts.yml
remote_user = root
private_key_file = .work/id_ed25519
host_key_checking = False
interpreter_python = /usr/bin/python3
retry_files_enabled = False
collections_path = .work/ac
nocolor = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=30s -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
