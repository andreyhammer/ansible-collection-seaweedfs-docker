---
# The same tag is loaded into every node under two names so rolling_update can "upgrade" test-a -> test-b.
seaweed_version: test-a
seaweed_large_disk: false
health_check_timeout: 90

masters_list:
  - 172.29.14.11:9333
  - 172.29.14.12:9333
  - 172.29.14.13:9333

# Test nodes are privileged containers: never touch kernel settings that are not network-namespaced,
# otherwise they would change the developer's host.
common_sysctl:
  net.core.somaxconn: 4096
common_min_free_gb: 0

# Tiny tmpfs disks: cap the number of volumes instead of letting SeaweedFS derive it from free space.
volume_max_volumes: 12

# The admin server is protected by SEAWEED_ADMIN_PASSWORD (exported by run.sh), so it listens on all interfaces.

# Filer: PostgreSQL metadata store (started by run.sh inside node01) and the S3 gateway.
filer_postgres_enabled: true
filer_postgres_host: 172.29.14.11
filer_s3_enabled: true

# Extra options: every one of them is checked against the running containers in verify.yml.
seaweed_environment:
  GRPC_GO_RECV_BUFFER_SIZE: "1048576"
seaweed_localtime: true
seaweed_logging:
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
master_default_replication: "010"
master_volume_size_limit_mb: 64
volume_index_type: leveldbLarge
volume_data_center: dc1
volume_pre_stop_seconds: 5
volume_min_free_space: 1
volume_extra_args: ["-readMode=proxy"]
filer_s3_idle_timeout: 3600
filer_environment:
  S3_EXTERNAL_URL: "http://s3.test.local:8333"
master_config_files:
  - content: |
      [master.maintenance]
      scripts = """
        lock
        unlock
      """
      sleep_minutes = 17
    dest: /opt/seaweed/config/master.toml
    container_path: /etc/seaweedfs/master.toml
filer_config_files:
  - content: "# integration test\n"
    dest: /opt/seaweed/config/filer-test.conf
    container_path: /etc/seaweedfs/filer-test.conf
