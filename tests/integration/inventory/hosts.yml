---
# Test nodes 172.29.14.11-13: 3 masters, 1 filer, 1 admin, 6 volume servers, 2 workers.
# node04 (172.29.14.14) is "new hardware": its aliases are deployed only by add_node, using the group `node04`.
all:
  children:
    seaweed:
      children:
        master:
          hosts:
            master01: {ansible_host: 172.29.14.11, node_num: 1}
            master02: {ansible_host: 172.29.14.12, node_num: 2}
            master03: {ansible_host: 172.29.14.13, node_num: 3}
        filer:
          hosts:
            filer01: {ansible_host: 172.29.14.11, node_num: 1}
            # filer04 gets its PostgreSQL store from a real filer.toml instead of environment variables.
            filer04:
              ansible_host: 172.29.14.14
              node_num: 4
              filer_postgres_enabled: false
              filer_config_files:
                - dest: /opt/seaweed/config/filer04/filer.toml
                  container_path: /etc/seaweedfs/filer.toml
                  secret: true
                  content: |
                    [leveldb2]
                    enabled = false
                    [postgres2]
                    enabled = true
                    createTable = """
                      CREATE TABLE IF NOT EXISTS "%s" (
                        dirhash BIGINT, name VARCHAR(65535), directory VARCHAR(65535), meta bytea,
                        PRIMARY KEY (dirhash, name)
                      );
                    """
                    hostname = "172.29.14.11"
                    port = 5432
                    username = "seaweedfs"
                    password = "{{ lookup('ansible.builtin.env', 'SEAWEED_FILER_POSTGRES_PASSWORD') }}"
                    database = "seaweedfs"
                    sslmode = "disable"
                    enableUpsert = true
                    upsertQuery = """
                      INSERT INTO "%[1]s" (dirhash, name, directory, meta) VALUES($1, $2, $3, $4)
                      ON CONFLICT (dirhash, name) DO UPDATE SET directory=EXCLUDED.directory, meta=EXCLUDED.meta
                    """
        admin:
          hosts:
            admin01: {ansible_host: 172.29.14.11, node_num: 1, admin_bind_ip: 172.29.14.11}
        volume:
          hosts:
            volume01-dg01:
              ansible_host: 172.29.14.11
              volume_node_num: 1
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack01
            volume01-dg02:
              ansible_host: 172.29.14.11
              volume_node_num: 1
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack01
            volume02-dg01:
              ansible_host: 172.29.14.12
              volume_node_num: 2
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack02
            volume02-dg02:
              ansible_host: 172.29.14.12
              volume_node_num: 2
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack02
            volume03-dg01:
              ansible_host: 172.29.14.13
              volume_node_num: 3
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack03
            volume03-dg02:
              ansible_host: 172.29.14.13
              volume_node_num: 3
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack03
            volume04-dg01:
              ansible_host: 172.29.14.14
              volume_node_num: 4
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack04
            volume04-dg02:
              ansible_host: 172.29.14.14
              volume_node_num: 4
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack04
              # The data center comes from an options file (-options), not from a flag: the master must report it.
              volume_data_center: ""
              volume_extra_args: ["-options=/etc/seaweedfs/volume-options.conf"]
              volume_config_files:
                - content: "dataCenter=dc-from-file\n"
                  dest: /opt/seaweed/config/volume04-dg02/volume-options.conf
                  container_path: /etc/seaweedfs/volume-options.conf
        worker:
          hosts:
            worker01-ec01:
              ansible_host: 172.29.14.11
              worker_node_num: 1
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
              worker_metrics_port: 9327
            worker02-vacuum01:
              ansible_host: 172.29.14.12
              worker_node_num: 2
              worker_job_suffix: vacuum
              worker_job_index: 1
              worker_job_type: vacuum
            worker04-ec01:
              ansible_host: 172.29.14.14
              worker_node_num: 4
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
    # One group per physical node lets `add_node -e target_node=node04` deploy everything that runs on it.
    node04:
      hosts:
        filer04:
        volume04-dg01:
        volume04-dg02:
        worker04-ec01:
