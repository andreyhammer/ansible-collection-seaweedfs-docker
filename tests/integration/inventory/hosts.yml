---
# 3 test nodes (172.29.14.11-13): 3 masters, 1 filer, 1 admin, 6 volume servers, 2 workers.
all:
  children:
    seaweed:
      children:
        master:
          hosts:
            master01: {ansible_host: 172.29.14.11, node_num: 1}
            master02: {ansible_host: 172.29.14.12, node_num: 2}
            master03: {ansible_host: 172.29.14.13, node_num: 3}
        filer:
          hosts:
            filer01: {ansible_host: 172.29.14.11, node_num: 1}
        admin:
          hosts:
            admin01: {ansible_host: 172.29.14.11, node_num: 1}
        volume:
          hosts:
            volume01-dg01:
              ansible_host: 172.29.14.11
              volume_node_num: 1
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack01
            volume01-dg02:
              ansible_host: 172.29.14.11
              volume_node_num: 1
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack01
            volume02-dg01:
              ansible_host: 172.29.14.12
              volume_node_num: 2
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack02
            volume02-dg02:
              ansible_host: 172.29.14.12
              volume_node_num: 2
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack02
            volume03-dg01:
              ansible_host: 172.29.14.13
              volume_node_num: 3
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack03
            volume03-dg02:
              ansible_host: 172.29.14.13
              volume_node_num: 3
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack03
        worker:
          hosts:
            worker01-ec01:
              ansible_host: 172.29.14.11
              worker_node_num: 1
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
            worker02-vacuum01:
              ansible_host: 172.29.14.12
              worker_node_num: 2
              worker_job_suffix: vacuum
              worker_job_index: 1
              worker_job_type: vacuum
