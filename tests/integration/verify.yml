---
# Checks the deployed test cluster. Pass -e expect_version=<tag> to assert the running image tag.
- name: Verify containers
  hosts: seaweed
  gather_facts: false
  tasks:
    - name: Inspect the container
      ansible.builtin.command: >-
        docker inspect --format '{% raw %}{{.State.Running}} {{.Config.Image}}{% endraw %}' {{ inventory_hostname }}
      register: verify_container
      changed_when: false

    - name: Assert the container runs the expected image
      ansible.builtin.assert:
        that: verify_container.stdout | trim == 'true ' ~ verify_expected_image
      vars:
        verify_expected_image: >-
          {{ seaweed_image_repo | default('chrislusf/seaweedfs') }}:{{ expect_version | default(seaweed_version)
          }}{{ '_large_disk' if seaweed_large_disk | default(false) | bool else '' }}
        fail_msg: "{{ inventory_hostname }}: got '{{ verify_container.stdout }}'"
        quiet: true

- name: Verify the cluster through the API
  hosts: localhost
  gather_facts: false
  vars:
    verify_master: "http://{{ masters_list | first }}"
  tasks:
    - name: Read the cluster status
      ansible.builtin.uri:
        url: "{{ verify_master }}/cluster/status"
        return_content: true
      register: verify_cluster
      until: verify_cluster.json.Leader | default('') | length > 0
      retries: 20
      delay: 3

    - name: Assert all masters are in the raft group
      ansible.builtin.assert:
        that: (verify_cluster.json.Peers | default([]) | length) + 1 == groups['master'] | length
        fail_msg: "Expected {{ groups['master'] | length }} masters, got {{ verify_cluster.json }}"
        quiet: true

    - name: Read the topology
      ansible.builtin.uri:
        url: "{{ verify_master }}/dir/status"
        return_content: true
      register: verify_topology
      until: >-
        (verify_topology.content | regex_findall('"Url":"[0-9.]+:80[0-9]+"') | unique | length)
        == groups['volume'] | length
      retries: 20
      delay: 3

    - name: Assign a file id
      ansible.builtin.uri:
        url: "{{ verify_master }}/dir/assign"
        return_content: true
      register: verify_assign

    - name: Upload a test blob
      ansible.builtin.uri:
        url: "http://{{ verify_assign.json.url }}/{{ verify_assign.json.fid }}"
        method: POST
        body_format: form-multipart
        body:
          file:
            content: swfs-integration-test
            filename: test.txt
            mime_type: text/plain
        status_code: [200, 201]

    - name: Read the test blob back
      ansible.builtin.uri:
        url: "http://{{ verify_assign.json.url }}/{{ verify_assign.json.fid }}"
        return_content: true
      register: verify_blob
      failed_when: "'swfs-integration-test' not in verify_blob.content"

    - name: Check the filer and admin ports
      ansible.builtin.wait_for:
        host: "{{ hostvars[item.host].ansible_host }}"
        port: "{{ item.port }}"
        timeout: 20
      loop:
        - {host: filer01, port: 8888}
        - {host: admin01, port: 23646}

- name: Verify the extra options reach the containers
  hosts: master01:volume01-dg01:filer01
  gather_facts: false
  tasks:
    - name: Inspect the container
      ansible.builtin.command: >-
        docker inspect {{ inventory_hostname }}
        --format '{% raw %}{{json .Args}}|{{json .Config.Env}}|{{json .HostConfig.Binds}}|
        {{.HostConfig.LogConfig.Type}}{% endraw %}'
      register: verify_opts
      changed_when: false

    - name: Assert the options
      ansible.builtin.assert:
        that: "item in verify_opts.stdout"
        quiet: true
      loop: >-
        {{ common_checks + (host_checks[group_names | intersect(['master', 'volume', 'filer']) | first]) }}
      vars:
        common_checks: ["GRPC_GO_RECV_BUFFER_SIZE=1048576", "/etc/localtime:/etc/localtime:ro", "json-file"]
        host_checks:
          master: ["-defaultReplication=010", "-volumeSizeLimitMB=64"]
          volume:
            - "-index=leveldbLarge"
            - "-dataCenter=dc1"
            - "-preStopSeconds=5"
            - "-minFreeSpace=1"
            - "-max=12"
            - "-readMode=proxy"
          filer:
            - "-s3.idleTimeout=3600"
            - "S3_EXTERNAL_URL=http://s3.test.local:8333"
            - "/opt/seaweed/config/filer-test.conf:/etc/seaweedfs/filer-test.conf:ro"

- name: Verify the worker metrics endpoint
  hosts: worker01-ec01
  gather_facts: false
  tasks:
    - name: Read the Prometheus metrics
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ worker_metrics_port }}/metrics"
        return_content: true
      register: verify_worker_metrics
      retries: 10
      delay: 3
      until: verify_worker_metrics.status == 200

- name: Verify the config files took effect
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the topology
      ansible.builtin.uri:
        url: "http://172.29.14.11:9333/dir/status"
        return_content: true
      register: verify_topology

    - name: The data center set through the options file is reported by the master
      ansible.builtin.assert:
        that:
          - >-
            verify_topology.json.Topology.DataCenters | map(attribute='Id')
            | select('equalto', 'dc-from-file') | list | length == 1
        fail_msg: "no data center dc-from-file in the topology: the -options file was not applied"
        quiet: true
