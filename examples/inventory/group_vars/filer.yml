---
filer_port: 8888
filer_s3_enabled: true
# Three filers must share their metadata, so they use one PostgreSQL server (outside this collection).
# Export SEAWEED_FILER_POSTGRES_PASSWORD before running ansible-playbook.
filer_postgres_enabled: true
filer_postgres_host: 10.0.0.20

# ---- Optional settings ---------------------------------------------------------------------------------------
# S3 gateway
# filer_s3_port: 8333
# filer_s3_idle_timeout: 3600      # seconds; empty = SeaweedFS default

# PostgreSQL metadata store (the password comes from SEAWEED_FILER_POSTGRES_PASSWORD).
# filer_postgres_port: 5432
# filer_postgres_db: seaweedfs
# filer_postgres_user: seaweedfs

# Anything else, for example a real filer.toml: SeaweedFS reads it from /etc/seaweedfs/filer.toml, no flag needed
# (see docs/CONFIGURATION.md; the image's default filer.toml enables the built-in leveldb2 store).
# filer_environment: {S3_EXTERNAL_URL: "https://s3.example.com"}
# filer_config_files:
#   - {src: files/filer.toml, dest: /opt/seaweed/config/filer.toml, container_path: /etc/seaweedfs/filer.toml}
# filer_extra_volumes: []
# filer_logging: {}
