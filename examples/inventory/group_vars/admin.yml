---
admin_port: 23646

# ---- Optional settings ---------------------------------------------------------------------------------------
# The admin server listens on loopback only unless told otherwise, and workers need to reach its gRPC port. That port
# follows -ip only: a password (SEAWEED_ADMIN_PASSWORD) opens the web UI on all interfaces but NOT the worker port. So
# with workers set admin_bind_ip (the node IP the workers use, or 0.0.0.0), usually together with the password:
#   admin_bind_ip: 10.0.0.11            # -ip; set on the admin alias in hosts.yml
#   export SEAWEED_ADMIN_PASSWORD=...   # protects the web UI
# or, on an isolated trusted network only, admin_allow_insecure_bind: true (binds the node IP WITHOUT authentication).
# admin_user: admin                 # -adminUser; empty = SeaweedFS default
# admin_allow_insecure_bind: false
# Refuse to run when SEAWEED_ADMIN_PASSWORD is empty (otherwise the admin server is recreated without a password):
# admin_require_password: true
# An options file holds `optionName=optionValue` lines (it is not TOML):
# admin_extra_args: ["-options=/etc/seaweedfs/admin.conf"]
# admin_config_files:
#   - {src: files/admin.conf, dest: /opt/seaweed/config/admin/options.conf, container_path: /etc/seaweedfs/admin.conf}
# admin_environment: {}
# admin_extra_volumes: []
# admin_logging: {}
