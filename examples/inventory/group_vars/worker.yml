---
worker_jobs:
  ec:
    type: erasure_coding
    instances: 2
  balance:
    type: ec_balance
    instances: 1
  lifecycle:
    type: s3_lifecycle
    instances: 1
  vacuum:
    type: vacuum
    instances: 1

# 0 disables metrics. Override per alias (host_vars) to give workers distinct ports.
worker_metrics_port: 0

# ---- Optional settings ---------------------------------------------------------------------------------------
# Per alias (set in hosts.yml): worker_node_num, worker_job_suffix, worker_job_index, worker_job_type and optionally
# worker_id (-id; default: the container name) and worker_metrics_port.
# worker_max_execute: 1
# worker_admin_address: 10.0.0.11:23646   # default: the first host of the admin group, port 23646
# worker_extra_args: ["-options=/etc/seaweedfs/worker.conf"]
# worker_config_files:
#   - {src: files/worker.conf, dest: /opt/seaweed/config/worker/worker.conf, container_path: /etc/seaweedfs/worker.conf}
# worker_environment: {}
# worker_extra_volumes: []
# worker_logging: {}
