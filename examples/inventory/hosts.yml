---
# Example: five nodes (10.0.0.11-15), nothing else is assumed about the network.
#   node01-03: master, filer, worker (EC)   node01: admin   node01-05: volume servers (3 groups of 2 disks, own rack)
# Every container instance is a separate alias; ansible_host is the node IP, several aliases share a node.
# Per-alias options you may add: volume_disk_type, volume_index_dir, worker_id, worker_metrics_port, node-specific
# overrides of anything in group_vars/ (all options are listed there).
all:
  children:
    seaweed:
      children:
        master:
          hosts:
            master01: {ansible_host: 10.0.0.11, node_num: 1}
            master02: {ansible_host: 10.0.0.12, node_num: 2}
            master03: {ansible_host: 10.0.0.13, node_num: 3}
        filer:
          hosts:
            filer01: {ansible_host: 10.0.0.11, node_num: 1}
            filer02: {ansible_host: 10.0.0.12, node_num: 2}
            filer03: {ansible_host: 10.0.0.13, node_num: 3}
        admin:
          hosts:
            admin01: {ansible_host: 10.0.0.11, node_num: 1, admin_bind_ip: 10.0.0.11}
        volume:
          hosts:
            volume01-dg01:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack1
            volume01-dg02:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack1
            volume01-dg03:
              ansible_host: 10.0.0.11
              volume_node_num: 1
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack1
            volume02-dg01:
              ansible_host: 10.0.0.12
              volume_node_num: 2
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack2
            volume02-dg02:
              ansible_host: 10.0.0.12
              volume_node_num: 2
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack2
            volume02-dg03:
              ansible_host: 10.0.0.12
              volume_node_num: 2
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack2
            volume03-dg01:
              ansible_host: 10.0.0.13
              volume_node_num: 3
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack3
            volume03-dg02:
              ansible_host: 10.0.0.13
              volume_node_num: 3
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack3
            volume03-dg03:
              ansible_host: 10.0.0.13
              volume_node_num: 3
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack3
            volume04-dg01:
              ansible_host: 10.0.0.14
              volume_node_num: 4
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack4
            volume04-dg02:
              ansible_host: 10.0.0.14
              volume_node_num: 4
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack4
            volume04-dg03:
              ansible_host: 10.0.0.14
              volume_node_num: 4
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack4
            volume05-dg01:
              ansible_host: 10.0.0.15
              volume_node_num: 5
              volume_dg: 1
              volume_data_dirs: [/mnt/disk01, /mnt/disk02]
              volume_rack: rack5
            volume05-dg02:
              ansible_host: 10.0.0.15
              volume_node_num: 5
              volume_dg: 2
              volume_data_dirs: [/mnt/disk03, /mnt/disk04]
              volume_rack: rack5
            volume05-dg03:
              ansible_host: 10.0.0.15
              volume_node_num: 5
              volume_dg: 3
              volume_data_dirs: [/mnt/disk05, /mnt/disk06]
              volume_rack: rack5
        worker:
          hosts:
            worker01-ec01:
              ansible_host: 10.0.0.11
              worker_node_num: 1
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
            worker02-ec01:
              ansible_host: 10.0.0.12
              worker_node_num: 2
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
            worker03-ec01:
              ansible_host: 10.0.0.13
              worker_node_num: 3
              worker_job_suffix: ec
              worker_job_index: 1
              worker_job_type: erasure_coding
    # One group per physical node: `add_node -e target_node=node05` deploys everything that runs on that node.
    node01:
      hosts:
        master01:
        filer01:
        admin01:
        volume01-dg01:
        volume01-dg02:
        volume01-dg03:
        worker01-ec01:
    node02:
      hosts:
        master02:
        filer02:
        volume02-dg01:
        volume02-dg02:
        volume02-dg03:
        worker02-ec01:
    node03:
      hosts:
        master03:
        filer03:
        volume03-dg01:
        volume03-dg02:
        volume03-dg03:
        worker03-ec01:
    node04:
      hosts:
        volume04-dg01:
        volume04-dg02:
        volume04-dg03:
    node05:
      hosts:
        volume05-dg01:
        volume05-dg02:
        volume05-dg03:
